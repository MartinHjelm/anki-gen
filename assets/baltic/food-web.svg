<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150">
  <style>text{font-family:'IBM Plex Sans',sans-serif;font-size:10px;fill:#1a1916;}.lbl{fill:#6b6860;}</style>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b6860"/></marker></defs>
  <text x="160" y="18" text-anchor="middle" font-size="11">Plankton food web</text>
  <rect x="14" y="56" width="62" height="40" rx="3" fill="#e6f2eb" stroke="#1a5c3a"/>
  <text x="45" y="73" text-anchor="middle">phyto-</text>
  <text x="45" y="85" text-anchor="middle">plankton</text>
  <rect x="92" y="56" width="62" height="40" rx="3" fill="#e8f0f8" stroke="#1a4a7a"/>
  <text x="123" y="73" text-anchor="middle">ciliates</text>
  <text x="123" y="85" text-anchor="middle" class="lbl">(micro-zoo)</text>
  <rect x="170" y="56" width="62" height="40" rx="3" fill="#f0ebfa" stroke="#4a2a7a"/>
  <text x="201" y="79" text-anchor="middle">copepods</text>
  <rect x="248" y="56" width="58" height="40" rx="3" fill="#faf0e0" stroke="#7a4a10"/>
  <text x="277" y="79" text-anchor="middle">fish</text>
  <line x1="76" y1="76" x2="90" y2="76" stroke="#6b6860" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="154" y1="76" x2="168" y2="76" stroke="#6b6860" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="232" y1="76" x2="246" y2="76" stroke="#6b6860" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="160" y="122" text-anchor="middle" class="lbl">arrows = eaten by (energy flows up the web)</text>
</svg>
