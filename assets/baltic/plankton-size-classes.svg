<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 185" width="320" height="185">
  <style>text{font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;fill:#1a1916;}.lbl{fill:#6b6860;}</style>
  <text x="160" y="18" text-anchor="middle">Phytoplankton size classes</text>
  <circle cx="70" cy="74" r="6" fill="#1a5c3a"/>
  <circle cx="160" cy="74" r="13" fill="#1a4a7a"/>
  <circle cx="255" cy="74" r="24" fill="#4a2a7a"/>
  <text x="70" y="118" text-anchor="middle">pico</text>
  <text x="70" y="131" text-anchor="middle" class="lbl">&lt;2 um</text>
  <text x="160" y="118" text-anchor="middle">nano</text>
  <text x="160" y="131" text-anchor="middle" class="lbl">2-20 um</text>
  <text x="255" y="118" text-anchor="middle">micro</text>
  <text x="255" y="131" text-anchor="middle" class="lbl">&gt;20 um</text>
  <text x="70" y="150" text-anchor="middle" class="lbl" font-size="9">cyanobacteria</text>
  <text x="160" y="150" text-anchor="middle" class="lbl" font-size="9">cryptophytes</text>
  <text x="255" y="150" text-anchor="middle" class="lbl" font-size="9">diatoms, dino.</text>
</svg>
