  <rect x="80" y="70" width="150" height="30" fill="#9db8d0" stroke="#d8d5cc"/>
  <rect x="80" y="100" width="150" height="48" fill="#1a4a7a" stroke="#d8d5cc"/>
  <text x="155" y="57" text-anchor="middle">warm / fresh — lighter</text>
  <text x="155" y="89" text-anchor="middle">pycnocline</text>
  <text x="155" y="128" text-anchor="middle" fill="#ffffff">cold / saline — denser</text>
