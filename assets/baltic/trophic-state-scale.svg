<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" width="320" height="150">
  <style>text{font-family:'IBM Plex Sans',sans-serif;font-size:10px;fill:#1a1916;}.lbl{fill:#6b6860;}</style>
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe2f2"/><stop offset="1" stop-color="#1a5c3a"/></linearGradient>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6b6860"/></marker>
  </defs>
  <text x="160" y="22" text-anchor="middle" font-size="11">Trophic-state scale</text>
  <rect x="20" y="38" width="280" height="30" fill="url(#tg)" stroke="#d8d5cc"/>
  <text x="55" y="88" text-anchor="middle">oligotrophic</text>
  <text x="128" y="88" text-anchor="middle">mesotrophic</text>
  <text x="200" y="88" text-anchor="middle">eutrophic</text>
  <text x="270" y="88" text-anchor="middle">hypertrophic</text>
  <line x1="20" y1="112" x2="300" y2="112" stroke="#6b6860" stroke-width="1" marker-end="url(#ar)"/>
  <text x="160" y="130" text-anchor="middle" class="lbl">nutrients and productivity increase</text>
</svg>
