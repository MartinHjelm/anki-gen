<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <style>
    text { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; fill: #1a1916; }
    .lbl { font-size: 11px; fill: #6b6860; }
    .axis { stroke: #6b6860; stroke-width: 1; }
    .curve { fill: none; stroke: #1a4a7a; stroke-width: 2; }
    .mark { stroke: #1a4a7a; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .arrow { stroke: #6b6860; stroke-width: 1; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <path id="bell" d="M20,150 C100,150 130,42 160,42 C190,42 220,150 300,150 Z"/>
    <clipPath id="tail"><rect x="235" y="0" width="65" height="180"/></clipPath>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b6860"/>
    </marker>
  </defs>
  <text x="160" y="18" text-anchor="middle">Distribution of T under H₀</text>
  <use href="#bell" fill="#e8f0f8"/>
  <use href="#bell" fill="#d2603f" fill-opacity="0.6" clip-path="url(#tail)"/>
  <use href="#bell" class="curve"/>
  <line class="axis" x1="20" y1="150" x2="305" y2="150"/>
  <text x="307" y="153" class="lbl">T</text>
  <line class="mark" x1="235" y1="150" x2="235" y2="118"/>
  <text x="235" y="110" text-anchor="middle" class="lbl">observed t</text>
  <path class="arrow" d="M285,128 C278,140 272,145 263,148"/>
  <text x="288" y="124" text-anchor="middle">p-value</text>
</svg>
