<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 185" width="320" height="185">
  <style>
    text { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; fill: #1a1916; }
    .lbl { font-size: 11px; fill: #6b6860; }
    .axis { stroke: #6b6860; stroke-width: 1; }
    .curve { fill: none; stroke: #1a4a7a; stroke-width: 2; }
    .mark { stroke: #1a4a7a; stroke-width: 1.5; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <path id="bell" d="M20,150 C100,150 130,42 160,42 C190,42 220,150 300,150 Z"/>
    <clipPath id="left"><rect x="20" y="0" width="80" height="150"/></clipPath>
    <clipPath id="right"><rect x="220" y="0" width="80" height="150"/></clipPath>
  </defs>
  <text x="160" y="18" text-anchor="middle">Rejection regions (two-sided, level α)</text>
  <use href="#bell" fill="#e8f0f8"/>
  <use href="#bell" fill="#d2603f" fill-opacity="0.6" clip-path="url(#left)"/>
  <use href="#bell" fill="#d2603f" fill-opacity="0.6" clip-path="url(#right)"/>
  <use href="#bell" class="curve"/>
  <line class="axis" x1="20" y1="150" x2="305" y2="150"/>
  <line class="mark" x1="100" y1="150" x2="100" y2="120"/>
  <line class="mark" x1="220" y1="150" x2="220" y2="120"/>
  <text x="160" y="112" text-anchor="middle" class="lbl">do not reject H₀</text>
  <text x="58"  y="140" text-anchor="middle">reject</text>
  <text x="262" y="140" text-anchor="middle">reject</text>
  <text x="63"  y="170" text-anchor="middle" class="lbl">α/2</text>
  <text x="257" y="170" text-anchor="middle" class="lbl">α/2</text>
</svg>
