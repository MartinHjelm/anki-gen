<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 185" width="320" height="185">
  <style>
    text { font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; fill: #1a1916; }
    .lbl { font-size: 11px; fill: #6b6860; }
    .axis { stroke: #6b6860; stroke-width: 1; }
    .curve { fill: none; stroke: #1a4a7a; stroke-width: 2; }
    .small { stroke: #6b6860; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .big { stroke: #d2603f; stroke-width: 1.8; }
    .arrow { stroke: #6b6860; stroke-width: 1; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <path id="bell" d="M20,150 C100,150 130,42 160,42 C190,42 220,150 300,150 Z"/>
    <clipPath id="tail"><rect x="250" y="0" width="50" height="150"/></clipPath>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b6860"/>
    </marker>
  </defs>
  <text x="160" y="16" text-anchor="middle">Larger |T| ⇒ deeper in the tail ⇒ smaller p</text>
  <use href="#bell" fill="#e8f0f8"/>
  <use href="#bell" fill="#d2603f" fill-opacity="0.6" clip-path="url(#tail)"/>
  <use href="#bell" class="curve"/>
  <line class="axis" x1="20" y1="150" x2="305" y2="150"/>
  <line class="small" x1="190" y1="150" x2="190" y2="100"/>
  <line class="big"   x1="250" y1="150" x2="250" y2="118"/>
  <path class="arrow" d="M150,70 C165,80 178,90 188,98"/>
  <text x="120" y="66" text-anchor="middle" class="lbl">small |T|: near centre, large p</text>
  <path class="arrow" d="M285,86 C280,98 270,108 252,116"/>
  <text x="288" y="80" text-anchor="middle">large |T|</text>
</svg>
