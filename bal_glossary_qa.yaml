deck: "Baltic Sea CMEMS — Glossary Q&A Drill"
description: "Atomic question-answer pairs on Baltic Sea oceanography, optics, biogeochemistry, plankton ecology, and satellite ocean-colour (CMEMS). Sections progress from foundational recall to integrative synthesis."
theme: default
tags: [oceanography, baltic-sea, remote-sensing, cmems, plankton]
note_type: basic

sections:
  - title: "Tier 1 — Foundational Recall"
    cards:
      - term: "Water column"
        q: "What is the water column?"
        a: "The vertical extent of water from the sea surface down to the seafloor, treated as a one-dimensional frame for depth-varying properties."
        image: assets/baltic/water-column.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Water column"
        q: "What properties vary along the water column?"
        a: "Temperature, salinity, light, and plankton concentration."
      - term: "Practical Salinity Unit (PSU)"
        q: "What is a Practical Salinity Unit (PSU)?"
        a: "A dimensionless salinity scale defined from the electrical conductivity of seawater relative to a standard KCl solution at 15 °C."
      - term: "Practical Salinity Unit (PSU)"
        q: "What is the typical salinity of standard open-ocean seawater?"
        a: "About 35 PSU."
      - term: "Brackish water"
        q: "What is brackish water?"
        a: "Water with salinity between freshwater (0 PSU) and full ocean water (~35 PSU), typically 0.5–30 PSU."
      - term: "Adiabatic process"
        q: "What is an adiabatic process?"
        a: "A thermodynamic change in which a parcel exchanges no heat with its surroundings; temperature change comes only from work done against pressure."
      - term: "Potential temperature"
        q: "What is potential temperature?"
        a: "The temperature a water parcel would have if moved adiabatically (without exchanging heat) to the surface pressure level."
      - term: "Potential temperature"
        q: "What is the ocean-model variable name for potential temperature?"
        a: "thetao."
      - term: "Wind stress"
        q: "What is wind stress?"
        a: "The horizontal force per unit area (N m⁻²) that the atmosphere exerts on the sea surface through friction."
      - term: "Convective cooling"
        q: "What is convective cooling?"
        a: "Loss of heat from the surface ocean to a colder atmosphere, making surface water denser so it sinks."
        image: assets/baltic/convective-cooling.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Mixed layer"
        q: "What is the mixed layer?"
        a: "The near-surface ocean layer actively stirred by wind and convection, with nearly uniform temperature and density."
        image: assets/baltic/mixed-layer.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Mixed layer"
        q: "What is the NEMO variable name for mixed-layer depth?"
        a: "mlotst."
      - term: "Stratification"
        q: "What is stratification?"
        a: "Stable vertical layering of the water column into distinct density layers, with lighter water floating on denser water."
        image: assets/baltic/stratification.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Upwelling"
        q: "What is upwelling?"
        a: "The vertical transport of cool, nutrient-rich deeper water to the ocean surface."
        image: assets/baltic/upwelling.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Sea-ice concentration"
        q: "What is sea-ice concentration?"
        a: "The fraction of the sea surface covered by ice at a given location, from 0 (ice-free) to 1 (fully covered)."
      - term: "Anoxia & Hypoxia"
        q: "What is hypoxia?"
        a: "Dissolved oxygen below ~2 mg/L — too low to support most marine life."
      - term: "Anoxia & Hypoxia"
        q: "What is anoxia?"
        a: "Complete absence of dissolved oxygen."
      - term: "Baltic Inflow (Major Baltic Inflow)"
        q: "What is a Major Baltic Inflow?"
        a: "A periodic inflow of dense, saline North Sea water through the Danish Straits along the seafloor into the deep Baltic basins."
        image: assets/baltic/major-baltic-inflow.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Anthropogenic"
        q: "What does \"anthropogenic\" mean?"
        a: "Caused or substantially modified by human activity, as opposed to occurring naturally."
      - term: "Anthropogenic"
        q: "What is the primary cause of present-day Baltic eutrophication?"
        a: "Anthropogenic nutrient inputs from agriculture, wastewater, and atmospheric deposition."
      - term: "Catchment (drainage basin)"
        q: "What is a catchment?"
        a: "The total land area whose surface and subsurface water all drain into a single river, lake, or sea."
      - term: "Nitrate (NO₃⁻)"
        q: "What is the primary inorganic nitrogen form available to phytoplankton?"
        a: "Nitrate (NO₃⁻)."
      - term: "Phosphate (PO₄³⁻)"
        q: "What is the primary inorganic phosphorus form available to phytoplankton?"
        a: "Phosphate (PO₄³⁻)."
      - term: "Silicate (Si(OH)₄)"
        q: "What is silicate, and which organisms need it?"
        a: "Dissolved silica required by diatoms to build their glass-like cell walls (frustules)."
      - term: "Hydrogen sulfide (H₂S)"
        q: "What is hydrogen sulfide and where is it produced?"
        a: "A toxic gas produced by sulfate-reducing bacteria in fully anoxic water and sediments."
      - term: "Hydrogen sulfide (H₂S)"
        q: "Which Baltic biogeochemical model tracks H₂S as a state variable?"
        a: "ERGOM."
      - term: "Liebig's Law of the Minimum"
        q: "What does Liebig's Law of the Minimum state?"
        a: "Biological growth is constrained by the single scarcest essential resource, not by the total amount of resources available."
      - term: "Limiting nutrient"
        q: "What is a limiting nutrient?"
        a: "The single nutrient whose supply restricts phytoplankton growth below its maximum possible rate."
      - term: "Internal loading"
        q: "What is internal loading?"
        a: "The release of phosphorus stored in bottom sediments back into the water column, driven by anoxia rather than river inputs."
        image: assets/baltic/internal-loading.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Eutrophication"
        q: "What is eutrophication?"
        a: "The process by which a water body becomes enriched with nutrients, causing excessive algal growth, oxygen depletion, and reduced biodiversity."
      - term: "Photosynthesis"
        q: "What is photosynthesis?"
        a: "A light-driven process that converts CO₂ and water into sugars and O₂, powered by pigments such as chlorophyll-a."
      - term: "Pigment"
        q: "What is a pigment?"
        a: "A molecule that selectively absorbs particular wavelengths of light and reflects or transmits the rest."
      - term: "Pigment"
        q: "What is the dominant pigment in phytoplankton?"
        a: "Chlorophyll-a."
      - term: "Biomass"
        q: "What is biomass in plankton ecology?"
        a: "The total mass of living material in a defined volume or area — the standard currency for quantifying a plankton population."
      - term: "Biomass"
        q: "What units are typically used to quantify phytoplankton biomass?"
        a: "Milligrams of chlorophyll, milligrams of carbon, or cell counts per cubic metre."
      - term: "Taxonomy"
        q: "What is taxonomy?"
        a: "The formal hierarchical classification of organisms into ranks such as kingdom, phylum, class, order, family, genus, and species."
      - term: "Prokaryote"
        q: "What is a prokaryote?"
        a: "A single-celled organism whose DNA is not enclosed in a membrane-bound nucleus."
      - term: "Prokaryote"
        q: "Name three groups of prokaryotes."
        a: "Bacteria, archaea, and photosynthetic cyanobacteria."
      - term: "Prokaryote"
        q: "What CMEMS variable tracks Baltic prokaryotic plankton?"
        a: "PROKAR."
      - term: "Protists"
        q: "What are protists?"
        a: "Single-celled eukaryotic microorganisms — microbes with a true membrane-bound nucleus, in contrast to prokaryotes."
      - term: "Flagella (flagellum)"
        q: "What are flagella?"
        a: "Long whip- or thread-like cellular appendages used for locomotion in many microorganisms."
        image: assets/baltic/flagella.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Flagella (flagellum)"
        q: "What is the difference between a flagellum and flagella?"
        a: "Flagellum is the singular form; flagella is the plural."
      - term: "Frustule"
        q: "What is a frustule?"
        a: "The two-piece silica (glass) cell wall of a diatom."
      - term: "Phytoplankton"
        q: "What are phytoplankton?"
        a: "Microscopic photosynthetic organisms that drift in the water column, forming the base of marine food webs."
      - term: "Chlorophyll-a"
        q: "What is chlorophyll-a?"
        a: "The primary green pigment used by all phytoplankton for photosynthesis."
      - term: "Phycocyanin"
        q: "What is phycocyanin?"
        a: "A blue pigment unique to cyanobacteria, distinct from the chlorophyll-a present in all phytoplankton."
      - term: "Phycocyanin"
        q: "Which OLCI band targets phycocyanin?"
        a: "RRS620."
      - term: "Phytoplankton functional types (PFTs)"
        q: "What are phytoplankton functional types (PFTs)?"
        a: "A classification of phytoplankton into groups by ecological role and optical signature rather than strict taxonomy."
      - term: "Picoplankton"
        q: "What is picoplankton?"
        a: "The smallest phytoplankton size class, typically less than 2 µm in diameter, including tiny prokaryotic cyanobacteria."
        image: assets/baltic/plankton-size-classes.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Nanophytoplankton"
        q: "What is nanophytoplankton?"
        a: "Mid-sized phytoplankton cells in the 2–20 µm range, including cryptophytes and green algae."
      - term: "Nanophytoplankton"
        q: "What CMEMS variable represents nanophytoplankton?"
        a: "NANO (CRYPTO + half of GREEN)."
      - term: "Microphytoplankton"
        q: "What are microphytoplankton?"
        a: "The largest phytoplankton cells (>20 µm), composed primarily of diatoms and dinoflagellates."
      - term: "Microphytoplankton"
        q: "What CMEMS variable represents microphytoplankton?"
        a: "MICRO (DIATO + DINO)."
      - term: "Diatoms"
        q: "What are diatoms?"
        a: "Single-celled algae encased in an intricate glass-like silica shell called a frustule."
      - term: "Cyanobacteria"
        q: "What are cyanobacteria?"
        a: "Photosynthetic bacteria — not true algae — capable of fixing atmospheric nitrogen gas."
      - term: "Dinoflagellates"
        q: "What are dinoflagellates?"
        a: "Flagellated single-celled protists characterised by two perpendicular flagella."
      - term: "Cryptophytes"
        q: "What are cryptophytes?"
        a: "Small flagellated algae common in brackish coastal water and near river outflows, tolerant of low salinity and turbidity."
      - term: "Cryptophytes"
        q: "Which CMEMS variable tracks cryptophyte chlorophyll?"
        a: "CRYPTO."
      - term: "Flagellates"
        q: "What are flagellates?"
        a: "Organisms that propel themselves using one or more whip-like appendages called flagella."
      - term: "Nitrogen fixation"
        q: "What is nitrogen fixation?"
        a: "The biological conversion of inert dissolved N₂ gas into bioavailable ammonia."
        image: assets/baltic/nitrogen-fixation.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Cyanotoxins"
        q: "What are cyanotoxins?"
        a: "Bioactive toxins produced by certain cyanobacteria."
      - term: "Crustaceans"
        q: "What are crustaceans?"
        a: "Arthropods with a hard chitinous exoskeleton and multiple pairs of jointed limbs."
      - term: "Crustaceans"
        q: "Give examples of crustaceans."
        a: "Copepods, krill, amphipods, crabs, and barnacles."
      - term: "Zooplankton"
        q: "What is zooplankton?"
        a: "Animal-like plankton ranging from single-celled protists to small crustaceans that graze on phytoplankton and bacteria."
        image: assets/baltic/food-web.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Copepods"
        q: "What are copepods?"
        a: "Small crustaceans and the most abundant multicellular animals in the sea."
      - term: "Primary production"
        q: "What is primary production?"
        a: "The synthesis of organic carbon (biomass) from inorganic CO₂ by photosynthetic organisms."
      - term: "Primary production"
        q: "What units quantify net primary production?"
        a: "mg C m⁻³ day⁻¹."
      - term: "Trophic state"
        q: "What is trophic state?"
        a: "A classification of water bodies by their nutrient richness and associated biological productivity."
      - term: "Oligotrophic"
        q: "What does oligotrophic mean?"
        a: "Low in dissolved nutrients, low in phytoplankton biomass, and consequently very clear and transparent water."
      - term: "Algal bloom"
        q: "What is an algal bloom?"
        a: "A rapid, large increase in phytoplankton abundance."
      - term: "Spring bloom"
        q: "What is the spring bloom?"
        a: "The first major phytoplankton growth event of the year, triggered by increasing solar irradiance after winter."
      - term: "Summer bloom (cyanobacteria bloom)"
        q: "Which organisms dominate the Baltic summer bloom?"
        a: "Filamentous cyanobacteria such as Nodularia spumigena, Aphanizomenon flos-aquae, and Dolichospermum spp."
      - term: "Grazing"
        q: "What is grazing in plankton ecology?"
        a: "Consumption of phytoplankton and bacteria by zooplankton such as copepods, ciliates, and heterotrophic flagellates."
      - term: "Ciliates"
        q: "What are ciliates?"
        a: "Single-celled protists covered in hundreds to thousands of short hair-like cilia used for locomotion and feeding."
      - term: "Wavelength (nanometre, nm)"
        q: "What is wavelength?"
        a: "The distance between successive crests of an electromagnetic wave; it determines the colour of light."
        image: assets/baltic/wavelength-spectrum.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Wavelength (nanometre, nm)"
        q: "What is the visible-light wavelength range in nm?"
        a: "Approximately 400 nm (violet) to 700 nm (red)."
      - term: "Radiance & Irradiance"
        q: "What is radiance?"
        a: "The intensity of light arriving from or leaving in a single specified direction (W m⁻² sr⁻¹)."
      - term: "Radiance & Irradiance"
        q: "What is irradiance?"
        a: "The total light flux per unit area summed over all directions (W m⁻²)."
      - term: "Remote-sensing reflectance (Rrs)"
        q: "What is remote-sensing reflectance (Rrs)?"
        a: "The ratio of upwelling radiance leaving the ocean surface to downwelling solar irradiance, measured in sr⁻¹."
        image: assets/baltic/rrs-geometry.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Inherent Optical Properties (IOPs)"
        q: "What are inherent optical properties (IOPs)?"
        a: "Optical properties of water that depend only on the dissolved and particulate substances present, independent of the ambient light field."
      - term: "Backscattering"
        q: "What is backscattering?"
        a: "The fraction of incident light scattered back toward the light source by particles suspended in the water."
        image: assets/baltic/backscattering.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "CDOM (Coloured Dissolved Organic Matter)"
        q: "What is CDOM?"
        a: "Yellow-brown dissolved organic material leached from soils and vegetation, carried to the sea by rivers — sometimes called \"yellow substance\" or Gelbstoff."
      - term: "Diffuse attenuation coefficient (Kd)"
        q: "What does the diffuse attenuation coefficient Kd measure?"
        a: "How rapidly downwelling light intensity decreases with depth, in units of m⁻¹."
        image: assets/baltic/kd-attenuation.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Diffuse attenuation coefficient (Kd)"
        q: "What does KD490 specifically measure?"
        a: "Light attenuation at 490 nm (blue-green light)."
      - term: "Secchi depth"
        q: "What is Secchi depth?"
        a: "The depth at which a white disk lowered into the water becomes invisible to an observer on the surface — a simple measure of water transparency."
      - term: "Band-ratio algorithm"
        q: "What is a band-ratio algorithm?"
        a: "An empirical satellite ocean-colour algorithm that estimates chlorophyll-a from the ratio of remote-sensing reflectance at two wavelengths."
        image: assets/baltic/band-ratio.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "QAA (Quasi-Analytical Algorithm)"
        q: "What is the Quasi-Analytical Algorithm (QAA)?"
        a: "A semi-analytical inversion that derives inherent optical properties from Rrs by inverting the physics of underwater light propagation."
      - term: "Fluorescence line height"
        q: "What is fluorescence line height?"
        a: "A measure of chlorophyll fluorescence emitted by phytoplankton in a narrow band around 683–685 nm when illuminated by sunlight."
      - term: "Fluorescence line height"
        q: "Which OLCI band is the fluorescence band?"
        a: "RRS681_25."
      - term: "In-situ measurement"
        q: "What is an in-situ measurement?"
        a: "A direct measurement made at the location of interest by an instrument physically present there, in contrast to remote sensing."
      - term: "Swath"
        q: "What is a satellite swath?"
        a: "The strip of the Earth's surface imaged in a single satellite pass, set by the sensor's field of view and orbital geometry."
        image: assets/baltic/swath.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "MERIS"
        q: "What is MERIS?"
        a: "A 15-band ocean-colour spectrometer aboard ESA's Envisat satellite, the direct predecessor of OLCI."
      - term: "OLCI"
        q: "What is OLCI?"
        a: "A passive optical sensor aboard the European Sentinel-3A and -3B satellites, measuring reflected sunlight in 21 spectral bands from 400 to 1020 nm."
      - term: "OLCI"
        q: "At what spatial resolution does OLCI image the ocean?"
        a: "300 m."
      - term: "L3 product"
        q: "What is an L3 satellite product?"
        a: "A satellite data level where individual swath measurements (L2) are re-projected onto a regular geographic grid and composited."
      - term: "Neural network (ocean colour)"
        q: "What is a neural network in ocean-colour retrieval?"
        a: "A machine-learning algorithm trained on coincident in-situ chlorophyll measurements and satellite reflectance to retrieve chlorophyll-a and other variables."
      - term: "Primitive equations"
        q: "What are the \"primitive equations\"?"
        a: "The set of partial differential equations that ocean general-circulation models like NEMO solve to evolve the three-dimensional state of the ocean."
      - term: "NEMO"
        q: "What is NEMO?"
        a: "An open-source ocean modelling framework that solves the primitive equations of ocean dynamics on a 3D structured grid."
      - term: "ERGOM"
        q: "What is ERGOM?"
        a: "A biogeochemical model originally developed at the Leibniz Institute for Baltic Sea Research (IOW) in Rostock and extended at BSH."
      - term: "ERGOM"
        q: "Which CMEMS product uses ERGOM?"
        a: "BALTICSEA_ANALYSISFORECAST_BGC_003_007."
      - term: "HYPE"
        q: "What is HYPE?"
        a: "A semi-distributed hydrological model developed by SMHI for simulating river discharge and nutrient loads from terrestrial catchments."
      - term: "De Boyer Montégut method"
        q: "What does the De Boyer Montégut method compute?"
        a: "Mixed-layer depth (MLD) from a vertical profile of temperature or density."
  - title: "Tier 2 — Mechanism & Process"
    cards:
      - term: "Practical Salinity Unit (PSU)"
        q: "How is PSU defined physically?"
        a: "From the electrical conductivity of seawater relative to a standard KCl solution at 15 °C and atmospheric pressure."
      - term: "Adiabatic process"
        q: "What happens when a water parcel is lifted adiabatically toward the surface?"
        a: "It expands slightly and cools, with no heat exchanged with its surroundings."
      - term: "Adiabatic process"
        q: "What is the conceptual purpose of the adiabatic correction in oceanography?"
        a: "To remove the pressure effect on temperature, converting in-situ temperature to potential temperature."
      - term: "Potential temperature"
        q: "Why is potential temperature the standard thermodynamic variable in ocean models?"
        a: "For thermodynamic consistency when comparing temperatures across different pressure levels."
      - term: "Wind stress"
        q: "How does wind stress drive ocean motion?"
        a: "It transfers momentum from air to water, generating surface currents and turbulent mixing in the mixed layer."
      - term: "Wind stress"
        q: "What is Ekman transport and how is it caused?"
        a: "A Coriolis-deflected net transport of surface water set up by wind stress; it controls coastal upwelling and downwelling."
        image: assets/baltic/ekman-transport.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Convective cooling"
        q: "What kind of mixing does convective cooling generate?"
        a: "Buoyancy-driven vertical mixing as cooled, denser surface water sinks."
      - term: "Convective cooling"
        q: "What two forces together deepen the mixed layer in autumn and winter?"
        a: "Wind stress and convective cooling."
      - term: "Mixed layer"
        q: "How does mixed-layer depth control bloom dynamics?"
        a: "A shallow mixed layer (5–15 m) concentrates phytoplankton and nutrients in a thin sunlit zone, favouring rapid bloom growth."
      - term: "Stratification"
        q: "How does strong stratification affect vertical mixing?"
        a: "It suppresses mixing, trapping surface nutrients and isolating cold, nutrient-rich deep water from sunlit layers."
      - term: "Upwelling"
        q: "What typically drives upwelling?"
        a: "Wind-induced divergence of surface currents."
      - term: "Upwelling"
        q: "How does upwelling affect algal blooms?"
        a: "By fertilising surface waters with nutrients from below, it can trigger or intensify blooms away from river inputs."
      - term: "Sea-ice concentration"
        q: "How does sea ice influence the spring phytoplankton bloom?"
        a: "Ice cover limits light penetration and delays bloom onset; ice-melt timing is a strong predictor of bloom date."
      - term: "Baltic Inflow (Major Baltic Inflow)"
        q: "What effect do Major Baltic Inflows have on deep-basin water?"
        a: "They ventilate anoxic bottom water, replenishing oxygen and temporarily halting sediment phosphorus release."
      - term: "Baltic Inflow (Major Baltic Inflow)"
        q: "What conditions drive a Major Baltic Inflow?"
        a: "Sustained westerly winds combined with specific sea-level pressure conditions."
      - term: "Nitrate (NO₃⁻)"
        q: "Why is winter surface nitrate predictive of the spring diatom bloom?"
        a: "The bloom consumes accumulated winter nitrate, so higher winter stocks fuel a larger bloom."
      - term: "Phosphate (PO₄³⁻)"
        q: "Why does phosphate accumulate in Baltic bottom water during winter?"
        a: "Anoxic conditions release iron-bound phosphorus from sediments (internal loading), in addition to river inputs."
      - term: "Silicate (Si(OH)₄)"
        q: "Why does silicate act as a \"bloom-type switch\" in the Baltic?"
        a: "It has no other major biological sink; once depleted, diatom growth stops and the community shifts to flagellates and cyanobacteria."
      - term: "Internal loading"
        q: "How does internal loading work chemically?"
        a: "When bottom oxygen drops to zero, iron-phosphorus compounds in the sediment dissolve and phosphate diffuses upward into the water column."
      - term: "Pigment"
        q: "What accessory pigment distinguishes cyanobacteria from other phytoplankton?"
        a: "Phycocyanin."
      - term: "Pigment"
        q: "What accessory pigment is characteristic of dinoflagellates?"
        a: "Peridinin."
      - term: "Biomass"
        q: "Why is satellite chlorophyll-a used as a biomass proxy?"
        a: "Direct biomass cannot be measured from space, but chlorophyll-a can — and it is present in all phytoplankton."
      - term: "Taxonomy"
        q: "How is traditional phytoplankton taxonomy carried out?"
        a: "By microscopic identification of cell structure and morphology."
      - term: "Protists"
        q: "Name some phototrophic protists."
        a: "Diatoms, dinoflagellates, cryptophytes, and green algae."
      - term: "Protists"
        q: "Name some heterotrophic protists."
        a: "Ciliates, heterotrophic flagellates, and foraminifera."
      - term: "Flagella (flagellum)"
        q: "How are dinoflagellate flagella arranged?"
        a: "Two flagella oriented perpendicular to each other — one transverse, one trailing."
        image: assets/baltic/flagella-arrangement.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Flagella (flagellum)"
        q: "How are cryptophyte flagella arranged?"
        a: "Two flagella of similar length emerging from a gullet-like groove."
      - term: "Frustule"
        q: "How are the two halves of a frustule arranged?"
        a: "Like a Petri dish and its lid — an upper and a lower valve that fit together."
        image: assets/baltic/frustule.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Phytoplankton"
        q: "What share of global oxygen production do phytoplankton account for?"
        a: "Roughly half."
      - term: "Chlorophyll-a"
        q: "What wavelengths does chlorophyll-a absorb most strongly?"
        a: "Red (~665 nm) and blue (~443 nm), while reflecting green."
        image: assets/baltic/chlorophyll-absorption.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Phycocyanin"
        q: "At what wavelength does phycocyanin absorb characteristically?"
        a: "Around 620 nm."
      - term: "Phytoplankton functional types (PFTs)"
        q: "What does PFT retrieval enable from satellite data?"
        a: "Bloom-type identification from ocean colour alone — e.g. diatom spring bloom vs. cyanobacteria summer bloom."
      - term: "Picoplankton"
        q: "Why does picoplankton dominate in oligotrophic waters?"
        a: "Large cells cannot compete effectively in nutrient-poor conditions, so small cells with high surface-area-to-volume ratios win."
      - term: "Microphytoplankton"
        q: "Why do microphytoplankton increase sediment oxygen demand?"
        a: "They sink quickly when they die, exporting organic carbon to depth and consuming bottom-water oxygen as they decompose."
      - term: "Diatoms"
        q: "What ends a Baltic diatom bloom?"
        a: "Exhaustion of dissolved silicate, after which other phytoplankton groups take over."
      - term: "Dinoflagellates"
        q: "What is a \"red tide\"?"
        a: "A dense red or brown surface discoloration of the water caused by dinoflagellate blooms."
      - term: "Cryptophytes"
        q: "How do cryptophytes tolerate Baltic conditions?"
        a: "They handle low salinity and turbid coastal water well, and are identified by their distinctive accessory pigments."
      - term: "Flagellates"
        q: "Which phytoplankton groups belong to the flagellates?"
        a: "Dinoflagellates, cryptophytes, and other motile algae."
      - term: "Nitrogen fixation"
        q: "What enzyme catalyses nitrogen fixation?"
        a: "Nitrogenase, found in certain cyanobacteria and other bacteria."
      - term: "Cyanotoxins"
        q: "How are cyanotoxins categorised?"
        a: "Into hepatotoxins (e.g. nodularin, microcystin) that attack the liver, and neurotoxins (e.g. anatoxin, saxitoxin) that attack the nervous system."
      - term: "Zooplankton"
        q: "What two main processes terminate a phytoplankton bloom?"
        a: "Nutrient depletion and grazing by zooplankton."
      - term: "Primary production"
        q: "How is net primary production (NPP) defined?"
        a: "Gross photosynthesis minus phytoplankton respiration."
      - term: "Trophic state"
        q: "What is the standard trophic-state scale?"
        a: "Oligotrophic → mesotrophic → eutrophic → hypertrophic."
        image: assets/baltic/trophic-state-scale.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Oligotrophic"
        q: "Which phytoplankton size class thrives in oligotrophic waters?"
        a: "Picoplankton, which outcompete larger bloom-formers in nutrient-poor conditions."
      - term: "Algal bloom"
        q: "What three conditions are needed for an algal bloom?"
        a: "Sufficient nutrients, adequate light, and favourable physical conditions such as warm temperature and stratification."
      - term: "Summer bloom (cyanobacteria bloom)"
        q: "What physical conditions drive the Baltic summer cyanobacteria bloom?"
        a: "Warm temperatures, shallow thermal stratification, and elevated phosphate from internal loading."
      - term: "Ciliates"
        q: "What do marine ciliates feed on?"
        a: "Nanophytoplankton and bacteria, occupying a trophic level between phytoplankton and crustacean zooplankton."
      - term: "Wavelength (nanometre, nm)"
        q: "Why are CMEMS Rrs bands named by their centre wavelength?"
        a: "Each band targets a specific absorbing or scattering constituent of seawater (e.g. RRS443 = 443 nm)."
      - term: "Radiance & Irradiance"
        q: "Why is remote-sensing reflectance defined as a radiance-to-irradiance ratio?"
        a: "Dividing upwelling radiance by downwelling irradiance normalises out variation in the brightness of the sun."
      - term: "Remote-sensing reflectance (Rrs)"
        q: "What does Rrs physically represent?"
        a: "The colour of the ocean as seen from space — different water constituents absorb and scatter different wavelengths."
      - term: "Inherent Optical Properties (IOPs)"
        q: "What are the two fundamental IOPs?"
        a: "The absorption coefficient (a, m⁻¹) and the backscattering coefficient (b_bp, m⁻¹)."
      - term: "Backscattering"
        q: "What makes the particulate backscattering coefficient (BBP) high?"
        a: "Many suspended particles in the water — either living algae or inorganic sediment."
      - term: "CDOM (Coloured Dissolved Organic Matter)"
        q: "At what wavelengths does CDOM absorb most strongly?"
        a: "In the blue-violet part of the spectrum."
      - term: "Secchi depth"
        q: "How does Secchi depth relate to algal biomass?"
        a: "Inversely — high biomass means a shallow Secchi reading."
      - term: "Band-ratio algorithm"
        q: "How does a band-ratio CHL algorithm work mechanically?"
        a: "The blue/green Rrs ratio shifts as chlorophyll absorbs more strongly in blue; the relationship is calibrated against in-situ measurements."
      - term: "QAA (Quasi-Analytical Algorithm)"
        q: "How does QAA differ from band-ratio algorithms?"
        a: "QAA inverts the physics of underwater light propagation rather than fitting empirical band ratios."
      - term: "In-situ measurement"
        q: "Give some examples of marine in-situ platforms."
        a: "Shipboard CTDs, moored buoys, Argo floats, ferry-mounted sensors, and discrete water samples analysed in the lab."
      - term: "Swath"
        q: "How are daily L3 composites built from satellite swaths?"
        a: "By remapping multiple swaths onto a fixed geographic grid and reducing them to a single per-pixel value (e.g. mean or maximum) per day."
      - term: "OLCI"
        q: "Which ocean-colour sensor did OLCI replace?"
        a: "MERIS aboard ESA's Envisat."
      - term: "L3 product"
        q: "How do L4 products differ from L3 products?"
        a: "L4 products take L3 further by gap-filling with statistical or model methods."
      - term: "Primitive equations"
        q: "Which equations make up the \"primitive equations\"?"
        a: "Horizontal momentum (Navier–Stokes with rotation and gravity), mass continuity, thermodynamic energy, salt conservation, and an equation of state."
      - term: "NEMO"
        q: "What ocean fields does NEMO simulate?"
        a: "Temperature, salinity, currents, sea-ice, and mixing."
      - term: "ERGOM"
        q: "What biogeochemical cycles does ERGOM simulate?"
        a: "Nitrogen, phosphorus, silicate, and carbon cycles plus plankton dynamics in the Baltic Sea."
      - term: "HYPE"
        q: "How does HYPE drive ERGOM?"
        a: "It supplies daily discharge and nitrogen/phosphorus/silicate loads as river boundary conditions to ERGOM."
      - term: "De Boyer Montégut method"
        q: "How does the De Boyer Montégut method define mixed-layer depth?"
        a: "As the shallowest depth where potential density differs from the surface value by a fixed threshold, typically 0.03 kg m⁻³."
  - title: "Tier 3 — Baltic-Specific Context"
    cards:
      - term: "Water column"
        q: "What is the maximum water-column depth in the Baltic Sea?"
        a: "About 459 m, at the Landsort Deep."
      - term: "Practical Salinity Unit (PSU)"
        q: "What is the salinity range of the Baltic Sea in PSU?"
        a: "Roughly 2 PSU in the northern Bothnian Bay to about 10 PSU in the central basin."
      - term: "Brackish water"
        q: "What is special about the Baltic Sea's brackish status?"
        a: "It is the world's largest brackish-water body."
      - term: "Brackish water"
        q: "What are typical Baltic brackish salinities?"
        a: "~2 PSU in the northern gulfs to ~10 PSU in the central basin."
      - term: "Adiabatic process"
        q: "How large is the adiabatic correction in the shallow Baltic?"
        a: "Negligible — less than 0.05 °C."
      - term: "Potential temperature"
        q: "How does Baltic potential temperature differ from in-situ temperature?"
        a: "By less than 0.05 °C, because Baltic depths are too shallow for the pressure correction to matter much."
      - term: "Wind stress"
        q: "How often is wind stress supplied to NEMO in the Baltic forecast?"
        a: "Every few hours, from an atmospheric forecast."
      - term: "Stratification"
        q: "What is the key physical trigger for Baltic cyanobacteria blooms?"
        a: "Summer stratification driven by solar heating."
      - term: "Upwelling"
        q: "Which Baltic coastlines experience episodic upwelling?"
        a: "The Swedish and Estonian coasts, driven by alongshore winds."
      - term: "Sea-ice concentration"
        q: "Where in the Baltic does significant sea ice form every winter?"
        a: "The northern Baltic — Gulf of Bothnia and Gulf of Finland."
      - term: "Anoxia & Hypoxia"
        q: "Where in the Baltic is chronic anoxia found?"
        a: "In stagnant bottom water of the deep basins, isolated by salinity stratification."
      - term: "Baltic Inflow (Major Baltic Inflow)"
        q: "How often do Major Baltic Inflows occur?"
        a: "Irregularly — sometimes separated by decades."
      - term: "Anthropogenic"
        q: "By how much have anthropogenic N and P loads raised Baltic nutrient levels?"
        a: "Roughly four- to eight-fold above pre-industrial baselines."
      - term: "Catchment (drainage basin)"
        q: "How large is the Baltic catchment?"
        a: "About 1.7 million km² across fourteen countries — roughly four times the area of the sea itself."
      - term: "Catchment (drainage basin)"
        q: "Name some major rivers of the Baltic catchment."
        a: "The Neva, Vistula, Oder, and Daugava."
      - term: "Nitrate (NO₃⁻)"
        q: "How does nitrate enter the Baltic?"
        a: "Mainly via rivers draining agricultural catchments."
      - term: "Phosphate (PO₄³⁻)"
        q: "How does summer stratification make Baltic bottom-water phosphate available?"
        a: "The mixed layer shoals, so phosphate-rich deep water becomes accessible to surface phytoplankton."
      - term: "Hydrogen sulfide (H₂S)"
        q: "What does H₂S in bottom water indicate?"
        a: "Total anoxia — conditions more extreme than simple hypoxia."
      - term: "Hydrogen sulfide (H₂S)"
        q: "Which Baltic basins accumulate H₂S between ventilation events?"
        a: "Gotland Deep, Landsort Deep, and Bornholm Deep."
      - term: "Limiting nutrient"
        q: "What limits Baltic spring diatom blooms?"
        a: "Nitrogen (nitrate)."
      - term: "Limiting nutrient"
        q: "What limits Baltic summer cyanobacteria blooms?"
        a: "Phosphorus (phosphate)."
      - term: "Eutrophication"
        q: "How is the Baltic Sea ranked globally for eutrophication?"
        a: "One of the most severely eutrophied seas in the world."
      - term: "Photosynthesis"
        q: "What share of global photosynthesis is performed by oceanic phytoplankton?"
        a: "Roughly half."
      - term: "Prokaryote"
        q: "Which prokaryotes dominate Baltic picoplankton?"
        a: "Picocyanobacteria such as Synechococcus."
      - term: "Frustule"
        q: "Why are diatom frustules valuable for paleoclimatic research?"
        a: "Silica resists decomposition, so frustules accumulate in seafloor sediments and form long-lived paleoclimatic archives."
      - term: "Phytoplankton functional types (PFTs)"
        q: "How many PFT variables does the CMEMS Baltic plankton product provide?"
        a: "Eight: DIATO, DINO, CRYPTO, GREEN, PROKAR, MICRO, NANO, and PICO."
      - term: "Diatoms"
        q: "When do diatoms dominate Baltic blooms?"
        a: "During the spring bloom, while silicate and other nutrients are still abundant."
      - term: "Cyanobacteria"
        q: "When and where do Baltic cyanobacteria form blooms?"
        a: "In summer, forming large paint-like surface scums across the basin."
      - term: "Cyanobacteria"
        q: "Why are Baltic cyanobacterial blooms a public-health concern?"
        a: "Some species produce toxins harmful to animals and humans, triggering bathing advisories."
      - term: "Dinoflagellates"
        q: "When do Baltic dinoflagellate blooms occur?"
        a: "During warm-season conditions when phosphorus is abundant."
      - term: "Cyanotoxins"
        q: "Which toxin does the main Baltic bloom-former Nodularia spumigena produce?"
        a: "Nodularin, a potent liver toxin in mammals and fish."
      - term: "Crustaceans"
        q: "Which crustaceans dominate the open Baltic?"
        a: "Copepods — by far the most numerous and the principal grazers of phytoplankton."
      - term: "Zooplankton"
        q: "Which zooplankton group dominates the Baltic?"
        a: "Copepods."
      - term: "Copepods"
        q: "What role do copepods play in the Baltic spring bloom?"
        a: "They are the primary grazers of phytoplankton, controlling whether the bloom ends by grazing or by nutrient depletion."
      - term: "Trophic state"
        q: "How is most of the Baltic classified for trophic state?"
        a: "Eutrophic to hypertrophic, the result of decades of anthropogenic nutrient loading."
      - term: "Oligotrophic"
        q: "Where in the Baltic are conditions closest to oligotrophic?"
        a: "The open northern Bothnian Bay."
      - term: "Algal bloom"
        q: "What two major algal-bloom types occur annually in the Baltic?"
        a: "A diatom-dominated spring bloom and a cyanobacteria-dominated summer bloom."
        image: assets/baltic/bloom-seasonal-cycle.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "Spring bloom"
        q: "Which group dominates the Baltic spring bloom and in what months?"
        a: "Diatoms, typically between March and May, beginning first in the southern Baltic."
      - term: "Ciliates"
        q: "When are ciliates the dominant grazers in the Baltic?"
        a: "During the post-spring transitional period, when copepod populations are still building up."
      - term: "CDOM (Coloured Dissolved Organic Matter)"
        q: "Why is CDOM such a problem for Baltic ocean-colour algorithms?"
        a: "It is the dominant optical constituent, causing standard blue/green band-ratio CHL algorithms to systematically fail in the Baltic."
      - term: "Diffuse attenuation coefficient (Kd)"
        q: "What does high KD490 indicate about the water?"
        a: "Turbid, murky water — indicating either high biomass, high CDOM, or high suspended sediment load."
      - term: "Secchi depth"
        q: "What Secchi depths indicate a dense bloom vs. clear, oligotrophic water?"
        a: "1–2 m indicates a dense bloom; 8–10 m indicates clear, oligotrophic water."
      - term: "QAA (Quasi-Analytical Algorithm)"
        q: "Which CMEMS Baltic variables are QAA-derived?"
        a: "ADG443, APH443, and BBP443."
      - term: "Swath"
        q: "How wide is the OLCI swath?"
        a: "About 1270 km, giving cloud-free coverage every 1–2 days from combined Sentinel-3A and -3B."
      - term: "MERIS"
        q: "When did MERIS operate?"
        a: "From 2002 to April 2012, aboard ESA's Envisat satellite."
      - term: "MERIS"
        q: "What gap followed MERIS before OLCI began?"
        a: "About four years — Envisat ended unexpectedly in 2012, and OLCI began returning usable data only in April 2016."
      - term: "OLCI"
        q: "When did usable ocean-colour OLCI data become available?"
        a: "Approximately April 2016, after Sentinel-3A's February 2016 launch."
      - term: "L3 product"
        q: "What resolutions are the CMEMS Baltic L3 ocean-colour composites delivered at?"
        a: "Daily L3 composites at 300 m (OLCI) or 1 km (multi-sensor) resolution."
      - term: "Neural network (ocean colour)"
        q: "What algorithm does the CMEMS Baltic CHL product use?"
        a: "A region-specific neural network tuned for Baltic optical conditions."
      - term: "NEMO"
        q: "How does NEMO interact with ERGOM in the CMEMS Baltic forecast?"
        a: "NEMO provides the physical ocean state that drives the coupled ERGOM biogeochemical model."
        image: assets/baltic/model-coupling.svg
        image_side: back
        image_credit: "Diagram authored for this deck"
      - term: "ERGOM"
        q: "How is ERGOM coupled to NEMO?"
        a: "One-way — ERGOM receives NEMO's physical fields to drive biogeochemical processes."
      - term: "HYPE"
        q: "How many sub-catchments does E-HYPE cover for the Baltic?"
        a: "About 7 000 sub-catchments draining into the sea."
      - term: "De Boyer Montégut method"
        q: "Which NEMO variable is computed via the De Boyer Montégut method?"
        a: "mlotst — the mixed-layer depth."
  - title: "Tier 4 — Connections & Synthesis"
    cards:
      - term: "Practical Salinity Unit (PSU)"
        q: "Why is the Baltic salinity contrast the \"master physical control\" on stratification?"
        a: "Strong horizontal and vertical salinity gradients dominate Baltic density structure, more than temperature does."
      - term: "Brackish water"
        q: "Why does Baltic brackish water force region-specific ocean-colour algorithms?"
        a: "Low salinity, high CDOM, and shallow depths combine to make the Baltic optically complex, breaking standard global algorithms."
      - term: "Convective cooling"
        q: "How does spring surface heating reverse winter convection?"
        a: "It flips the sign of the surface buoyancy flux, re-establishing the seasonal stratification needed for bloom initiation."
      - term: "Sea-ice concentration"
        q: "How does Baltic ice melt affect stratification?"
        a: "It delivers a pulse of fresh, low-density meltwater that strengthens stratification and primes the spring bloom."
      - term: "Anoxia & Hypoxia"
        q: "What two anoxia-driven chemical changes sustain Baltic summer blooms?"
        a: "Sulfate reduction to H₂S, and dissolution of iron-bound phosphorus from sediments (internal loading)."
      - term: "Catchment (drainage basin)"
        q: "Why does the HYPE model bridge terrestrial land management and Baltic biogeochemistry?"
        a: "Because nutrient and CDOM loads reaching the Baltic originate from human land use within the catchment, which HYPE simulates daily."
      - term: "Nitrate (NO₃⁻)"
        q: "Why does the spring community shift composition once nitrate runs out?"
        a: "Nitrate depletion ends nitrate-limited growth and favours groups that bypass nitrate limitation, like N₂-fixing cyanobacteria."
      - term: "Phosphate (PO₄³⁻)"
        q: "How does phosphate fuel summer cyanobacterial blooms?"
        a: "When stratification brings bottom-water phosphate within reach, N₂-fixing cyanobacteria thrive on it, sustaining blooms for weeks."
      - term: "Liebig's Law of the Minimum"
        q: "Why doesn't reducing only nitrogen inputs reduce Baltic summer blooms?"
        a: "Summer blooms are phosphorus-limited per Liebig's Law — N₂-fixing cyanobacteria bypass nitrogen limitation entirely."
      - term: "Limiting nutrient"
        q: "Why is phosphorus the ultimate Baltic bloom control even though nitrogen is sometimes scarce?"
        a: "Cyanobacteria can fix dissolved N₂ gas, so phosphorus — not nitrogen — sets the ceiling on summer bloom intensity."
      - term: "Internal loading"
        q: "Why does internal loading make Baltic restoration so difficult?"
        a: "Summer blooms can intensify even when river nutrient loading is reduced, because phosphorus is released from sediments within the basin."
      - term: "Eutrophication"
        q: "What is the root cause of intensifying Baltic summer cyanobacteria blooms?"
        a: "Decades of eutrophication driven by agricultural and wastewater nutrient loading from nine surrounding countries."
      - term: "Pigment"
        q: "Why do accessory pigments matter for satellite ocean-colour retrieval?"
        a: "Their distinct absorption spectra let satellite sensors discriminate phytoplankton groups (e.g. phycocyanin → cyanobacteria)."
      - term: "Taxonomy"
        q: "Why do phytoplankton functional types depart from strict taxonomy?"
        a: "Because two taxonomically distinct organisms can play the same biogeochemical role, so grouping by ecological/optical role is more useful."
      - term: "Protists"
        q: "Why is the autotrophic/heterotrophic protist split useful?"
        a: "It captures the basic producer–consumer division of microbial plankton — a key axis of the food web."
      - term: "Phycocyanin"
        q: "Why is phycocyanin essential for satellite cyanobacteria detection?"
        a: "It lets satellite algorithms identify cyanobacterial blooms even when total chlorophyll is not unusually elevated."
      - term: "Diatoms"
        q: "Why do diatoms efficiently export carbon to depth?"
        a: "They sink quickly when they die, carrying carbon and nutrients downward to the seafloor."
      - term: "Cyanobacteria"
        q: "Why does cyanobacterial N₂ fixation make phosphorus the controlling nutrient?"
        a: "N₂-fixers bypass nitrogen limitation, so phosphorus availability becomes the ultimate ceiling on bloom intensity."
      - term: "Flagellates"
        q: "Why is flagellate motility ecologically advantageous?"
        a: "They can adjust their vertical position in the water column to access the best mix of surface light and deeper nutrients."
      - term: "Nitrogen fixation"
        q: "Why does N₂ fixation give Baltic cyanobacteria a summer advantage?"
        a: "Nitrate is depleted by mid-summer, but N₂-fixers can still source nitrogen from dissolved N₂ gas, decisively outcompeting non-fixers."
      - term: "Cyanotoxins"
        q: "Why do Baltic summer blooms regularly trigger dog and livestock warnings?"
        a: "Cyanotoxin exposure can be hazardous to swimmers, dogs, and livestock, and is the reason beaches close."
      - term: "Crustaceans"
        q: "How do mysid shrimp fit into the Baltic food web?"
        a: "They link zooplankton and fish, transferring energy from the plankton food web up to higher trophic levels."
      - term: "Copepods"
        q: "Why do copepod population dynamics matter for bloom termination?"
        a: "They determine whether a Baltic bloom ends by grazing pressure or by nutrient depletion — a top-down vs. bottom-up control."
      - term: "Primary production"
        q: "Why does primary production matter for the global carbon cycle?"
        a: "It is the main biological pathway by which atmospheric CO₂ enters the ocean carbon cycle."
      - term: "Algal bloom"
        q: "How can algal blooms cause fish kills?"
        a: "By depleting dissolved oxygen during the bacterial decomposition that follows the bloom collapse."
      - term: "Spring bloom"
        q: "Why does the Baltic spring bloom export so much carbon to the seafloor?"
        a: "It is the most productive event of the year, and the diatoms that dominate it sink quickly, exporting organic carbon and silica."
      - term: "Summer bloom (cyanobacteria bloom)"
        q: "Why can summer-bloom cyanobacteria thrive when nitrate is depleted?"
        a: "They fix dissolved N₂ gas via nitrogenase, bypassing nitrogen limitation entirely."
      - term: "Grazing"
        q: "How does grazing impose a top-down control on bloom magnitude?"
        a: "When zooplankton populations build, grazing pressure can suppress phytoplankton biomass even when nutrients remain plentiful."
      - term: "Inherent Optical Properties (IOPs)"
        q: "Why decompose total IOPs into APH, ADG, and BBP?"
        a: "It allows discrimination of phytoplankton, dissolved+detrital matter, and particulate scatterers from a single satellite spectrum."
      - term: "Backscattering"
        q: "How does combining BBP with APH separate algae from sediment?"
        a: "APH isolates phytoplankton absorption while BBP captures total particle scattering — together they distinguish biological from physical turbidity."
      - term: "CDOM (Coloured Dissolved Organic Matter)"
        q: "Why does high CDOM near river mouths trace terrestrial runoff?"
        a: "CDOM originates from soils and vegetation in the catchment, so its concentration directly indicates river-borne organic matter reaching the sea."
      - term: "Remote-sensing reflectance (Rrs)"
        q: "Why is Rrs the fundamental satellite ocean-colour observable?"
        a: "All ocean-colour products — CHL, KD490, IOPs — are ultimately derived from Rrs."
      - term: "Band-ratio algorithm"
        q: "Why do band-ratio CHL algorithms fail in the Baltic?"
        a: "CDOM also absorbs strongly in the blue, mimicking the spectral signature of chlorophyll and confusing the band ratio."
      - term: "Fluorescence line height"
        q: "Why can fluorescence be more accurate than band ratios in high-CDOM waters?"
        a: "Fluorescence is emitted directly by chlorophyll near 683 nm and does not rely on blue absorption, which CDOM confuses."
      - term: "In-situ measurement"
        q: "Why are in-situ data the \"ground truth\" for satellite algorithms?"
        a: "They calibrate retrieval algorithms (like the Baltic CHL neural network) and validate physical and biogeochemical models."
      - term: "MERIS"
        q: "Why can CMEMS Baltic historical records reach back to 2002?"
        a: "MERIS shared resolution and bands with its successor OLCI, allowing reprocessed historical records to extend back to 2002."
      - term: "Neural network (ocean colour)"
        q: "Why use a Baltic-specific neural network for chlorophyll retrieval?"
        a: "High Baltic CDOM biases standard band-ratio algorithms; a regional NN can account for multiple absorbing components simultaneously."
      - term: "Primitive equations"
        q: "Why is the set called \"primitive\" equations?"
        a: "They use the hydrostatic and Boussinesq approximations, simplifying full Navier–Stokes while retaining large-scale ocean physics."
      - term: "HYPE"
        q: "Why is HYPE suitable as an operational forecast driver?"
        a: "Its discharge and nutrient-load outputs are available in near-real-time, matching the cadence required for operational forecasting."
